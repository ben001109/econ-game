version: "3.9"

services:
  postgres:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-game}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in a private untracked root .env file}
      POSTGRES_DB: ${POSTGRES_DB:-game}
    ports:
      - "${ECON_BIND_ADDRESS:-127.0.0.1}:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    ports:
      - "${ECON_BIND_ADDRESS:-127.0.0.1}:6379:6379"
    volumes:
      - redis-data:/data

  py-api:
    build: ./python/services/api
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in a private untracked root .env file}
      REDIS_URL: ${REDIS_URL:?Set REDIS_URL in a private untracked root .env file}
      PORT: 4000
      LOG_LEVEL: info
    ports:
      - "${ECON_BIND_ADDRESS:-127.0.0.1}:4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  py-worker:
    build: ./python/services/worker
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in a private untracked root .env file}
      REDIS_URL: ${REDIS_URL:?Set REDIS_URL in a private untracked root .env file}
      TICK_INTERVAL_SECONDS: 5
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  py-frontend:
    build: ./python/services/frontend
    environment:
      API_BASE_URL: http://py-api:4000
      PORT: 3000
    ports:
      - "${ECON_BIND_ADDRESS:-127.0.0.1}:3000:3000"
    depends_on:
      py-api:
        condition: service_started

  py-bot:
    build: ./python/services/bot
    environment:
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:?Set DISCORD_BOT_TOKEN in a private untracked root .env file}
      API_BASE_URL: http://py-api:4000
      GUILD_ID: ${GUILD_ID:-}
    depends_on:
      py-api:
        condition: service_started

  adminer:
    image: adminer:4@sha256:c1c24d89d06fcb8fc0fb5a049240dc292ff4a121ae05d7e74d64b58c421d2921
    profiles: ["tools"]
    ports:
      - "${ECON_BIND_ADDRESS:-127.0.0.1}:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  redis-commander:
    image: rediscommander/redis-commander:latest@sha256:19cd0c49f418779fa2822a0496c5e6516d0c792effc39ed20089e6268477e40a
    profiles: ["tools"]
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "${ECON_BIND_ADDRESS:-127.0.0.1}:8081:8081"
    depends_on:
      redis:
        condition: service_started

volumes:
  db-data:
  redis-data:
