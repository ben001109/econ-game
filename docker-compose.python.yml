version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: game
      POSTGRES_PASSWORD: gamepass
      POSTGRES_DB: game
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U game -d game"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  py-api:
    build: ./python/services/api
    environment:
      DATABASE_URL: postgresql+asyncpg://game:gamepass@postgres:5432/game
      REDIS_URL: redis://redis:6379/0
      PORT: 4000
      LOG_LEVEL: info
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  py-worker:
    build: ./python/services/worker
    environment:
      DATABASE_URL: postgresql+asyncpg://game:gamepass@postgres:5432/game
      REDIS_URL: redis://redis:6379/0
      TICK_INTERVAL_SECONDS: 5
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  py-frontend:
    build: ./python/services/frontend
    environment:
      API_BASE_URL: http://py-api:4000
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      py-api:
        condition: service_started

  py-bot:
    build: ./python/services/bot
    environment:
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-change-me}
      API_BASE_URL: http://py-api:4000
      GUILD_ID: ${GUILD_ID:-}
    depends_on:
      py-api:
        condition: service_started

  adminer:
    image: adminer:4
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  redis-commander:
    image: rediscommander/redis-commander:latest
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "8081:8081"
    depends_on:
      redis:
        condition: service_started

volumes:
  db-data:
  redis-data:
