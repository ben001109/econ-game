name: CI

on:
  workflow_call:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migration-safety:
    name: Migration safety
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Reject schema push commands
        run: node scripts/check-migration-safety.mjs

  service-quality:
    name: Quality (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            dir: services/api
          - service: worker
            dir: services/worker
          - service: frontend
            dir: services/frontend
          - service: bot
            dir: services/bot
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.dir }}/package-lock.json

      - name: Install deps
        run: npm ci --no-audit --ignore-scripts

      - name: Generate Prisma Client (if script exists)
        timeout-minutes: 5
        run: npm run prisma:generate --if-present

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and invariant tests (when owned by service)
        run: npm run test --if-present

      - name: Build
        run: npm run build

  sdk-quality:
    name: SDK surface and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/econ-game-sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: packages/econ-game-sdk/package-lock.json
      - name: Install deps
        run: npm ci --no-audit --ignore-scripts
      - name: Verify SDK
        run: npm run verify

  docker-build:
    name: Docker Build (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [migration-safety, service-quality, sdk-quality]
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            context: services/api
          - service: worker
            context: services/worker
          - service: frontend
            context: services/frontend
          - service: bot
            context: services/bot
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile
          push: false
          load: true
          tags: econ-game/${{ matrix.service }}:ci
