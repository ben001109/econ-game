[project]
name = "econ-game-bot"
version = "0.1.0"
description = "Discord bot for the Econ Game Python stack"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "discord.py>=2.4",
  "httpx>=0.27",
  "pydantic>=2.7",
  "pydantic-settings>=2.3"
]

[project.optional-dependencies]
dev = [
  "ruff>=0.5"
]

[tool.uv]
package = true

[tool.uv.scripts]
bot-dev = "python -m econ_bot.main"
bot-prod = "python -m econ_bot.main"

[tool.ruff]
line-length = 100
target-version = "py312"
