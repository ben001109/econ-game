[project]
name = "econ-game-frontend"
version = "0.1.0"
description = "FastAPI + Jinja frontend shell for the Econ Game Python stack"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "jinja2>=3.1",
  "httpx>=0.27",
  "pydantic-settings>=2.3"
]

[project.optional-dependencies]
dev = [
  "ruff>=0.5"
]

[tool.uv]
package = true

[tool.uv.scripts]
frontend-dev = "uvicorn econ_frontend.main:app --reload --host 0.0.0.0 --port ${PORT:-3000}"
frontend-prod = "uvicorn econ_frontend.main:app --host 0.0.0.0 --port ${PORT:-3000}"

[tool.ruff]
line-length = 100
target-version = "py312"
